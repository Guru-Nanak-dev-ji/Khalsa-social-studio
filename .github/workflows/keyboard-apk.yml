name: KDN Punjabi Keyboard APK
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'keyboard-android/**'
      - '.github/workflows/keyboard-apk.yml'
permissions:
  contents: read
jobs:
  keyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unicode and layout tests
        working-directory: keyboard-android
        run: |
          mkdir -p build/core-tests
          javac -encoding UTF-8 -d build/core-tests app/src/main/java/world/khalsa/keyboard/KeyboardLayout.java tests/LayoutTest.java
          java -cp build/core-tests LayoutTest
      - name: Install SDK and build APKs
        working-directory: keyboard-android
        run: |
          keyboard_sdk="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$keyboard_sdk/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          gradle :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug --no-daemon --stacktrace
          mkdir -p build/deliverables
          cp app/build/outputs/apk/debug/app-debug.apk build/deliverables/KDN-Punjabi-Keyboard-0.1.apk
          sha256sum build/deliverables/KDN-Punjabi-Keyboard-0.1.apk > build/deliverables/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KDN-Punjabi-Keyboard-APK
          path: keyboard-android/build/deliverables/
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android IME typing checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash keyboard-android/scripts/emulator-test.sh
      - name: Upload keyboard screenshots and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KDN-Punjabi-Keyboard-QA
          path: keyboard-android/build/qa/
          if-no-files-found: warn
