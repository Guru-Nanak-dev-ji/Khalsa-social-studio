name: KDN static checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run local UI smoke tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Creator scripts and draft/offline behavior
        run: |
          node --check assets/creator.js
          node --check assets/creator-core.js
          node --check assets/poster.js
          node --check assets/poster-core.js
          node --check assets/community.js
          node --check assets/community-core.js
          node --check assets/gyan-content.js
          node --check assets/gyan.js
          node --check assets/duality-core.js
          node --check assets/duality.js
          node --check sw.js
          node --test tests/*.test.cjs
