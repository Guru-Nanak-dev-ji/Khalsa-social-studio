name: Generate Android PWA icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/generate_pwa_icons.py'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate PNG icons
        run: python scripts/generate_pwa_icons.py
      - name: Commit generated icons
        run: |
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Generate installable PWA PNG icons'
            git push
          fi
