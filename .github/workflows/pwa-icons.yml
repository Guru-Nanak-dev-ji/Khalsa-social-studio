name: Validate KHALSA app icons
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/*pwa_icons.py'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'icon-*.png'
      - 'assets/branding/**'
      - '.github/workflows/pwa-icons.yml'
  pull_request:
    paths:
      - 'scripts/*pwa_icons.py'
      - 'manifest.webmanifest'
      - 'icons/**'
      - 'icon-*.png'
      - 'assets/branding/**'
      - '.github/workflows/pwa-icons.yml'
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify committed artwork without overwriting icons
        run: python scripts/check_pwa_icons.py
