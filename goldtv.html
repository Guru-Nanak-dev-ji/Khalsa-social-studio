<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a0e05">
<meta name="description" content="📺 Golden TV — हर 3 second नई कहानी, ख़बर, नारा और 📜 ग्रंथ से एक वचन।">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/khalsa-v1-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="./assets/heritage.css">
<link rel="stylesheet" href="./assets/hindi-fonts.css">
<title>📺 Golden TV · KDN</title>
<style>
html,body{margin:0;height:100%;background:#0d0703;color:#fff1c8;font-family:Mukta,'Noto Sans Devanagari',sans-serif;overflow:hidden}
.tv{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:18px}
.frame{position:relative;width:min(92vw,440px);height:min(78vh,720px);border-radius:28px 28px 18px 18px;padding:14px;background:conic-gradient(from var(--a,0deg),#8a5a12,#fff1b8,#e2b04a,#8a5a12,#fff1b8,#8a5a12);animation:spin 6s linear infinite;box-shadow:0 0 40px #e2b04a55}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
@keyframes spin{to{--a:360deg}}
.screen{height:100%;border-radius:200px 200px 10px 10px/120px 120px 10px 10px;background:radial-gradient(circle at 50% 30%,#4a2a08,#1a0e05 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;box-sizing:border-box;overflow:hidden;position:relative}
.screen a{color:inherit;text-decoration:none;display:block}
.tag{font-family:'Rozha One',serif;color:#ffd76a;font-size:22px;margin-bottom:14px}
.text{font-size:26px;line-height:1.4}
.go{display:inline-block;margin-top:22px;padding:8px 18px;border:1.5px solid #e2b04a;border-radius:20px;color:#ffd76a;font-size:16px}
.slide{animation:up .6s ease-out}
@keyframes up{from{opacity:0;transform:translateY(60px) scale(.96)}to{opacity:1;transform:none}}
.bar{position:absolute;left:0;bottom:0;height:4px;background:#ffd76a;width:0}
.bar.run{animation:bar 3s linear}
@keyframes bar{to{width:100%}}
.ctl{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;z-index:2}
.ctl a,.ctl button{background:#2a1606;border:1px solid #e2b04a;color:#ffd76a;border-radius:16px;padding:6px 12px;font-size:15px;text-decoration:none;font-family:inherit}
.count{position:absolute;top:14px;right:22px;font-size:12px;color:#e2b04a}
@media (prefers-reduced-motion:reduce){.frame,.slide,.bar.run{animation:none}}
</style>
<script defer src="./assets/goldtv/goldtv-core.js"></script>
<script defer src="./assets/naksha/visit.js"></script></head>
<body class="kdn-hindi" data-heritage="court">
<div class="heritage-banner" aria-hidden="true"></div>
<div class="ctl"><a href="./studio.html">🏰 महल</a><button id="pp" aria-label="रोकें">⏸ रोकें</button></div>
<div class="tv"><div class="frame"><div class="screen" id="screen" aria-live="polite"><span class="count" id="count"></span><a id="story" class="slide"><div class="tag" id="tag">📺 Golden TV</div><div class="text" id="text">कहानियाँ आ रही हैं…</div><span class="go">खोलें →</span></a><div class="bar" id="bar"></div></div></div></div>
<script>
addEventListener('DOMContentLoaded',async()=>{const C=GoldTVCore;let items=[],feed=[],granth=[],chans=[],cyc=Math.floor(Math.random()*20),i=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,t;
const $=id=>document.getElementById(id);
try{feed=(await (await fetch('./assets/goldtv/feed.json',{cache:'no-cache'})).json()).items||[];}catch(e){}
try{granth=(await (await fetch('./assets/gyan/granth.json')).json()).quotes||[];}catch(e){}
const rebuild=()=>{items=C.build(feed,granth,cyc).concat(chans);};rebuild();
try{const r=await fetch(C.API+'/news/channels');if(r.ok){chans=C.fromChannels((await r.json()).channels);rebuild();}}catch(e){}
if(!items.length)items=[{tag:'🧬 नारा',text:'एक click और बदल जाए ज़िंदगी 🧬',href:'./studio.html'}];
function show(){const it=items[i],a=$('story');a.href=it.href;$('tag').textContent=it.tag;$('text').textContent=it.text;$('count').textContent=(i+1)+'/'+items.length;a.classList.remove('slide');void a.offsetWidth;a.classList.add('slide');const b=$('bar');b.classList.remove('run');void b.offsetWidth;if(!paused)b.classList.add('run');}
function loop(){clearTimeout(t);if(paused)return;t=setTimeout(()=>{i=C.next(i,items.length);if(i===0&&granth.length){cyc++;rebuild();}show();loop();},C.INTERVAL);}
$('pp').onclick=()=>{paused=!paused;$('pp').textContent=paused?'▶ चलाएँ':'⏸ रोकें';show();loop();};
if(paused)$('pp').textContent='▶ चलाएँ';
let y0=null;addEventListener('touchstart',e=>y0=e.touches[0].clientY,{passive:true});addEventListener('touchend',e=>{if(y0==null)return;const d=y0-e.changedTouches[0].clientY;if(Math.abs(d)>40){i=d>0?C.next(i,items.length):(i-1+items.length)%items.length;show();loop();}y0=null;});
show();loop();});
</script>
</body>
</html>
