plugins { id 'com.android.application' }

android {
    namespace 'world.khalsa.keyboard'
    compileSdk 35
    defaultConfig {
        applicationId 'world.khalsa.keyboard'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'world.khalsa.keyboard.KeyboardSmokeTest'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes { release { minifyEnabled false } }
}
