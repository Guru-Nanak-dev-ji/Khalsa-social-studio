name = "kdn-telegram-bot"
main = "worker.js"
compatibility_date = "2026-10-01"

# Not secret. Secrets are set with: wrangler secret put TELEGRAM_BOT_TOKEN / WEBHOOK_SECRET
[vars]
OWNER_ID = "7812291108"
GROUP_ID = "-1002221114009"
# Optional: test group id. When set, popups get a "🧪 Test group में डालो" button (callback post_test).
# Find the id: owner types /id in the group (bot DMs it). Uncomment and set:
TEST_GROUP_ID = "-1004340734853"

# YouTube OAuth: secrets YT_CLIENT_ID, YT_CLIENT_SECRET (wrangler secret put). Refresh token stored in KV:
[[kv_namespaces]]
binding = "KDN_KV"
id = "0b9d3ff65e384f52b886854af5e11d5f"
